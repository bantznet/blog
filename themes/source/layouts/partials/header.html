{{ $hero := site.Params.heroImage }}
<header class="hero {{ if .IsHome }}hero-lg{{ else }}hero-sm{{ end }}"{{ with $hero }} style="background-image:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url('{{ . | relURL }}')"{{ end }}>
  <div class="wrap bar">
    <nav>{{ range site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}</nav>
    <div class="social"><button id="tt" aria-label="Toggle dark mode"><svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      {{ with site.Params.github }}<a href="{{ . }}" aria-label="GitHub"><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>{{ end }}
      <a href="{{ "index.xml" | relURL }}" aria-label="RSS"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="19" r="2"/><path d="M3 10v3a8 8 0 0 1 8 8h3A11 11 0 0 0 3 10zm0-6v3a14 14 0 0 1 14 14h3A17 17 0 0 0 3 4z"/></svg></a>
    </div>
  </div>
  <div class="wrap hero-body">
    {{ if .IsHome }}<h1 class="brand">{{ site.Title }}</h1>{{ else }}<a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>{{ end }}
    {{ with site.Params.tagline }}<p class="tagline">{{ . }}</p>{{ end }}
    <div class="search">
      <input id="q" type="search" placeholder="Search…" autocomplete="off"><kbd>⌘ K</kbd>
      <ul id="results" hidden></ul>
    </div>
  </div>
</header>
