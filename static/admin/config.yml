# Sveltia CMS config. Saves commit straight to main, which deploys the site.
# New posts default to draft: true, so nothing publishes until Draft is turned off.
backend:
  name: github
  repo: bantznet/blog
  branch: main
  auth_methods: [token]   # sign in with a personal access token; no OAuth proxy

media_folder: static/images
public_folder: /images

collections:
  - name: posts
    label: Posts
    folder: content/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{draft}})"
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: Draft, name: draft, widget: boolean, default: true, hint: "Leave on until reviewed. Drafts are still readable in the public repo source."}
      - label: Tags
        name: tags
        widget: select
        multiple: true
        min: 1
        max: 3
        options: [homelab, home-automation, 3d-printing, motorcycles, blog]
        hint: "The FIRST tag shows on the card."
      - {label: Summary, name: summary, widget: text, hint: "~150 chars; card excerpt and link preview"}
      - {label: Cover, name: cover, widget: image, required: false, hint: "1600x900, under ~300 KB, subject in the middle 40%"}
      - {label: Cover alt text, name: coverAlt, widget: string, required: false, hint: "REQUIRED if a cover is set: one sentence describing the image"}
      - {label: Body, name: body, widget: markdown}

  - name: pages
    label: Pages
    files:
      - label: About
        name: about
        file: content/about.md
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Cover, name: cover, widget: image, required: false}
          - {label: Cover alt text, name: coverAlt, widget: string, required: false}
          - {label: Body, name: body, widget: markdown}
